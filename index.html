<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ô chữ Tiễn dặn người yêu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e9d2;--paper:#fbf5e6;--ink:#3b2a1c;--soft:#7a6247;--line:#c9b48a;--gap:#d9a79a;--red:#9b2d20;--ok:#cfe0b8;--okink:#2f4a1a;--bad:#f1b9ad;--sel:#f4e2a8;--btn:#9b2d20;--btnink:#fbf5e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1812;--paper:#2a2017;--ink:#f0e3c8;--soft:#b29d7c;--line:#5b4932;--gap:#7a3b32;--red:#e08a78;--ok:#3e5528;--okink:#dcecc4;--bad:#7a3a30;--sel:#4d3f1e;--btn:#c9604d;--btnink:#1f1812;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1812;--paper:#2a2017;--ink:#f0e3c8;--soft:#b29d7c;--line:#5b4932;--gap:#7a3b32;--red:#e08a78;--ok:#3e5528;--okink:#dcecc4;--bad:#7a3a30;--sel:#4d3f1e;--btn:#c9604d;--btnink:#1f1812;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lora,Georgia,serif;line-height:1.6}
.wrap{max-width:780px;margin:0 auto;padding:26px 14px 48px}
header{text-align:center;margin-bottom:18px}
.eyebrow{letter-spacing:.25em;font-size:12px;color:var(--red);text-transform:uppercase}
h1{font-family:'Playfair Display',serif;font-size:clamp(28px,6vw,42px);margin:6px 0 4px;font-weight:700}
.sub{font-style:italic;color:var(--soft);margin:0}
.rule{width:90px;height:2px;background:var(--red);margin:14px auto 0;opacity:.7}
.clue{position:sticky;top:0;z-index:5;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:4px;padding:10px 16px;margin-bottom:14px;min-height:78px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.clue small{display:block;color:var(--red);letter-spacing:.15em;text-transform:uppercase;font-size:11px}
.clue p{margin:2px 0 0;font-size:17px}
.boardbox{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(16,34px);grid-auto-rows:34px;gap:2px;width:max-content;margin:0 auto}
.cell{position:relative}
.cell input{width:100%;height:100%;border:1.5px solid var(--ink);border-radius:3px;text-align:center;font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:var(--ink);background:var(--paper);padding:0;text-transform:uppercase;caret-color:var(--red)}
.cell.hl input{background:var(--sel)}
.cell input:focus{outline:2px solid var(--red);outline-offset:1px;background:#fff3c4;color:#3b2a1c}
.cell.done input{background:var(--ok);color:var(--okink);border-color:var(--okink)}
.cell.bad input{background:var(--bad)}
.gap{width:100%;height:100%;background:var(--gap);border:1.5px solid var(--gap);border-radius:3px;cursor:pointer}
.cell.hl .gap{border-color:var(--red)}
.n{position:absolute;top:1px;left:3px;font-size:9px;font-weight:700;color:var(--red);pointer-events:none;line-height:1;z-index:1}
.fills{margin-top:18px;text-align:center}
.fills h2{font-family:'Playfair Display',serif;font-size:16px;margin:0 0 8px;color:var(--soft);font-weight:500}
.fills div{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fills button{border:0;background:var(--btn);color:var(--btnink);font-family:Lora,serif;font-size:13px;padding:8px 12px;border-radius:4px;cursor:pointer}
.tools{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.tools button{font-family:Lora,serif;font-size:15px;padding:9px 18px;border-radius:4px;border:1.5px solid var(--red);background:transparent;color:var(--red);cursor:pointer}
.tools button:hover{background:var(--red);color:var(--btnink)}
.legend{text-align:center;color:var(--soft);font-size:13px;margin-top:14px;font-style:italic}
.legend i{display:inline-block;width:12px;height:12px;background:var(--gap);vertical-align:-1px;margin-right:4px;border-radius:2px}
.msg{text-align:center;font-family:'Playfair Display',serif;color:var(--red);min-height:26px;margin-top:10px;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="eyebrow">Truyện thơ dân tộc Thái</div>
<h1>Tiễn dặn người yêu</h1>
<p class="sub">Xống chụ xon xao · Ô chữ</p>
<div class="rule"></div>
</header>
<div class="clue" id="clue"><small>Câu hỏi</small><p>Nhấn vào một ô chữ để đọc câu hỏi.</p></div>
<div class="boardbox"><div class="grid" id="grid"></div></div>
<div class="fills"><h2>Điền sẵn đáp án</h2><div id="fills"></div></div>
<div class="tools"><button id="check">Kiểm tra</button><button id="reset">Làm lại</button></div>
<div class="legend"><i></i>Ô màu đỏ nhạt là khoảng cách giữa các từ. Gõ không dấu. Nhấn lại vào ô giao nhau để đổi hướng.</div>
<div class="msg" id="msg"></div>
</div>
<script>
// d: 0 ngang, 1 dọc
const W=[
{x:7,y:0,d:0,a:"THAI",q:"Tên dân tộc đã sáng tác nên kiệt tác truyện thơ này."},
{x:7,y:0,d:1,a:"THUY CHUNG",q:"Phẩm chất tình cảm thiêng liêng nhất mà hai nhân vật luôn giữ trọn cho nhau."},
{x:3,y:0,d:1,a:"MUA DONG",q:"Mùa trong câu thơ hẹn ước: \"Không lấy được nhau mùa hạ, ta sẽ lấy nhau...\""},
{x:1,y:1,d:1,a:"BEN TRONG",q:"Điểm nhìn của đoạn trích."},
{x:6,y:2,d:0,a:"LUU LUYEN",q:"Tâm trạng bịn rịn, vừa đi vừa ngoảnh lại của đôi uyên ương lúc chia ly."},
{x:7,y:5,d:0,a:"CAI HUOC",q:"Vật dụng chàng trai dùng để chải lại mái tóc \"đầu bù\" cho cô gái khi thấy nàng bị hành hạ."},
{x:0,y:7,d:0,a:"XONG CHU XON XAO",q:"Tên tiếng Thái gốc của tác phẩm."},
{x:3,y:9,d:0,a:"LA NGON",q:"Loại lá độc tượng trưng cho sự tuyệt vọng tột cùng trên đường về nhà chồng."}
];
// đánh số theo thứ tự đọc
const starts=[...new Set(W.map(w=>w.y*100+w.x))].sort((a,b)=>a-b);
W.forEach(w=>{w.n=starts.indexOf(w.y*100+w.x)+1;w.pos=[...w.a].map((c,i)=>w.d?[w.x,w.y+i]:[w.x+i,w.y+i*0])});
const grid=document.getElementById('grid'),clue=document.getElementById('clue'),msg=document.getElementById('msg');
const C={}; // "x,y" -> {el,wrap,ch,ws:[]}
W.forEach((w,wi)=>w.pos.forEach(([x,y],i)=>{
  const k=x+','+y;
  if(!C[k])C[k]={x,y,ch:w.a[i],ws:[],wrap:null,el:null};
  C[k].ws.push(wi);
}));
let cur=0,lastK=null;
for(let y=0;y<10;y++)for(let x=0;x<16;x++){
  const k=x+','+y,c=C[k],box=document.createElement('div');box.className='cell';
  if(c){
    c.wrap=box;
    if(c.ch===' '){const g=document.createElement('div');g.className='gap';g.onclick=()=>pick(k);box.appendChild(g);}
    else{
      const inp=document.createElement('input');inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;
      c.el=inp;
      inp.addEventListener('click',()=>pick(k));
      inp.addEventListener('focus',()=>{if(!C[k].ws.includes(cur))select(C[k].ws[0])});
      inp.addEventListener('input',e=>{if(!e.isComposing)take(k)});
      inp.addEventListener('compositionend',()=>take(k));
      inp.addEventListener('keydown',e=>key(e,k));
      box.appendChild(inp);
    }
    const w=W.find(w=>w.x===x&&w.y===y);
    if(w){const n=document.createElement('span');n.className='n';n.textContent=w.n;box.appendChild(n);}
  }
  grid.appendChild(box);
}
const norm=c=>c.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toUpperCase();
function select(wi){
  cur=wi;const w=W[wi];
  Object.values(C).forEach(c=>c.wrap.classList.toggle('hl',c.ws.includes(wi)));
  const L=w.a.replace(/ /g,'').length;
  clue.innerHTML='<small>Câu '+w.n+' · '+(w.d?'Dọc':'Ngang')+' · '+L+' chữ cái, '+w.a.length+' ô</small><p></p>';
  clue.querySelector('p').textContent=w.q;
}
function pick(k){
  const c=C[k];
  if(lastK===k&&c.ws.length>1)select(c.ws.find(i=>i!==cur));
  else if(!c.ws.includes(cur))select(c.ws[0]);
  lastK=k;
  if(c.el)c.el.focus();
}
function move(k,d){
  const w=W[cur];let i=w.pos.findIndex(p=>p.join()===k);
  i+=d;while(i>=0&&i<w.pos.length&&!C[w.pos[i].join()].el)i+=d;
  if(i>=0&&i<w.pos.length){const nk=w.pos[i].join();C[nk].el.focus();lastK=nk;return nk}
  return null;
}
function take(k){
  const c=C[k];if(!c.el.value)return;
  c.el.value=norm(c.el.value.slice(-1));c.wrap.classList.remove('bad');
  move(k,1);evalAll();
}
function key(e,k){
  const c=C[k],w=W[cur];
  if(e.key==='Backspace'&&!c.el.value){const p=move(k,-1);if(p){C[p].el.value='';C[p].wrap.classList.remove('bad')}evalAll();e.preventDefault()}
  else if(e.key==='ArrowRight'){if(w.d)select(c.ws.find(i=>!W[i].d)??cur);move(k,1);e.preventDefault()}
  else if(e.key==='ArrowLeft'){if(w.d)select(c.ws.find(i=>!W[i].d)??cur);move(k,-1);e.preventDefault()}
  else if(e.key==='ArrowDown'){if(!w.d)select(c.ws.find(i=>W[i].d)??cur);move(k,1);e.preventDefault()}
  else if(e.key==='ArrowUp'){if(!w.d)select(c.ws.find(i=>W[i].d)??cur);move(k,-1);e.preventDefault()}
}
function evalAll(){
  Object.values(C).forEach(c=>c.wrap.classList.remove('done'));
  let all=true;
  W.forEach(w=>{
    const ok=w.pos.every(([x,y],i)=>w.a[i]===' '||norm(C[x+','+y].el.value||'')===w.a[i]);
    if(ok)w.pos.forEach(([x,y],i)=>{if(w.a[i]!==' ')C[x+','+y].wrap.classList.add('done')});else all=false;
  });
  msg.textContent=all?'Chúc mừng bạn đã hoàn thành ô chữ!':'';
}
function fill(wi){
  W[wi].pos.forEach(([x,y],i)=>{const c=C[x+','+y];if(c.el){c.el.value=W[wi].a[i];c.wrap.classList.remove('bad')}});
  select(wi);evalAll();
}
const fills=document.getElementById('fills');
W.forEach((w,i)=>{const b=document.createElement('button');b.textContent='Câu '+w.n+' '+(w.d?'dọc':'ngang');b.onclick=()=>fill(i);fills.appendChild(b)});
document.getElementById('check').onclick=()=>{
  let wrong=0;
  Object.values(C).forEach(c=>{if(!c.el)return;c.wrap.classList.remove('bad');
    if(c.el.value&&norm(c.el.value)!==c.ch){c.wrap.classList.add('bad');wrong++}});
  if(wrong)msg.textContent='Còn '+wrong+' ô chưa đúng.';else if(!msg.textContent)msg.textContent='Các ô đã điền đều đúng, tiếp tục nhé!';
};
document.getElementById('reset').onclick=()=>{
  Object.values(C).forEach(c=>{if(c.el)c.el.value='';c.wrap.classList.remove('bad','done')});msg.textContent='';
};
select(0);
</script>
</body>
</html>
